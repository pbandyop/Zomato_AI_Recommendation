# FastAPI + Streamlit (Streamlit UI in api mode proxies to backend).
# From repo root: docker compose -f docker-compose.streamlit.yml up --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: nextleap-zomato:streamlit-bundle
    command:
      ["uvicorn", "src.phase6.app:http_app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: dev
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed/restaurants_cleaned.csv:/app/data/processed/restaurants_cleaned.csv:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  streamlit:
    image: nextleap-zomato:streamlit-bundle
    depends_on:
      api:
        condition: service_started
    environment:
      STREAMLIT_BACKEND: api
      STREAMLIT_API_BASE_URL: http://api:8000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8501:8501"
    restart: unless-stopped
